<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedEMC · Registro de personas</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23df4e26'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='Arial,sans-serif' font-size='38' font-weight='800'%3ER%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <header class="encabezado-principal">
        <div class="container">
            <div class="marca-contenedor">
                <div class="marca-insignia" aria-hidden="true">R</div>
                <div>
                    <span class="marca-etiqueta">RedEMC · Prueba de desarrollo</span>
                    <h1 class="titulo-principal">Registro de personas</h1>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-4 py-md-5">
        <div class="row g-4 align-items-start">
            <div class="col-12 col-lg-5">
                <section class="tarjeta-panel" aria-labelledby="titulo-formulario">
                    <div class="tarjeta-cabecera">
                        <h2 id="titulo-formulario" class="tarjeta-titulo">Ingreso de datos</h2>
                    </div>

                    <div class="tarjeta-cuerpo">
                        <div id="alerta-formulario" class="alerta-estado d-none" role="alert" aria-live="polite"></div>

                        <form id="formulario-persona" novalidate>
                            <div class="grupo-campo">
                                <label for="nombre" class="etiqueta-campo">
                                    Nombre <span class="marca-obligatorio" aria-hidden="true">*</span>
                                </label>
                                <div class="campo-con-prefijo">
                                    <span class="prefijo-icono" aria-hidden="true">
                                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                            <circle cx="12" cy="7" r="4"/>
                                        </svg>
                                    </span>
                                    <input
                                        type="text"
                                        id="nombre"
                                        name="nombre"
                                        class="campo-entrada campo-con-icono"
                                        placeholder="Ej.: María José Peña"
                                        autocomplete="name"
                                        required
                                    >
                                </div>
                                <div id="error-nombre" class="mensaje-error" aria-live="polite"></div>
                            </div>

                            <div class="grupo-campo">
                                <label for="email" class="etiqueta-campo">
                                    Email <span class="marca-obligatorio" aria-hidden="true">*</span>
                                </label>
                                <div class="campo-con-prefijo">
                                    <span class="prefijo-icono" aria-hidden="true">
                                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                                        </svg>
                                    </span>
                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        class="campo-entrada campo-con-icono"
                                        placeholder="Ej.: mariapena@email.com"
                                        autocomplete="email"
                                        required
                                    >
                                </div>
                                <div id="error-email" class="mensaje-error" aria-live="polite"></div>
                            </div>

                            <div class="grupo-campo">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="telefono" class="etiqueta-campo mb-0">Teléfono</label>
                                    <span class="insignia-opcional">Opcional</span>
                                </div>
                                <div class="campo-con-prefijo">
                                    <span class="prefijo-bandera" title="Uruguay" aria-hidden="true">
                                        <svg class="bandera-uy" viewBox="0 0 27 18" xmlns="http://www.w3.org/2000/svg">
                                            <rect width="27" height="18" fill="#ffffff"/>
                                            <rect y="2" width="27" height="2" fill="#0038a8"/>
                                            <rect y="6" width="27" height="2" fill="#0038a8"/>
                                            <rect y="10" width="27" height="2" fill="#0038a8"/>
                                            <rect y="14" width="27" height="2" fill="#0038a8"/>
                                            <rect width="10" height="10" fill="#ffffff"/>
                                            <g stroke="#b45309" stroke-width="0.45" stroke-linecap="round">
                                                <line x1="5" y1="1.6" x2="5" y2="8.4"/>
                                                <line x1="1.6" y1="5" x2="8.4" y2="5"/>
                                                <line x1="2.6" y1="2.6" x2="7.4" y2="7.4"/>
                                                <line x1="7.4" y1="2.6" x2="2.6" y2="7.4"/>
                                            </g>
                                            <circle cx="5" cy="5" r="1.9" fill="#fcd116" stroke="#b45309" stroke-width="0.4"/>
                                        </svg>
                                    </span>
                                    <input
                                        type="tel"
                                        id="telefono"
                                        name="telefono"
                                        class="campo-entrada campo-telefono"
                                        placeholder="091234567"
                                        inputmode="numeric"
                                        autocomplete="tel"
                                    >
                                </div>
                                <div class="texto-ayuda">9 dígitos comenzando con 09.</div>
                                <div id="error-telefono" class="mensaje-error" aria-live="polite"></div>
                            </div>

                            <button type="submit" id="boton-guardar" class="boton-primario w-100 mt-2">
                                <span id="texto-boton">Guardar persona</span>
                                <span id="cargando-boton" class="d-none">
                                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                                    Guardando...
                                </span>
                            </button>
                        </form>
                    </div>
                </section>
            </div>

            <div class="col-12 col-lg-7">
                <section class="tarjeta-panel" aria-labelledby="titulo-listado">
                    <div class="tarjeta-cabecera d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <h2 id="titulo-listado" class="tarjeta-titulo">Listado de datos</h2>
                        <span id="contador-registros" class="pildora-contador">0 registros</span>
                    </div>

                    <div class="tarjeta-cuerpo p-0">
                        <div id="alerta-listado" class="alerta-estado m-3 d-none" role="alert" aria-live="polite"></div>

                        <div id="encabezado-listado" class="grilla-listado grilla-cabecera d-none d-md-grid">
                            <div class="celda-cabecera">Nombre</div>
                            <div class="celda-cabecera">Email</div>
                            <div class="celda-cabecera">Teléfono</div>
                            <div class="celda-cabecera">Fecha de registro</div>
                        </div>

                        <div id="contenedor-listado" class="lista-registros" aria-live="polite">
                            <div class="estado-vacio">Cargando registros...</div>
                        </div>

                        <div id="contenedor-paginacion" class="pie-paginacion d-none"></div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="pie-pagina">
        <div class="container text-center">
            RedEMC · Prueba de desarrollo
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="scripts/index.js"></script>
</body>
</html>
